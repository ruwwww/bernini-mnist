[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bernini-mnist"
version = "0.1.0"
description = "Bernini-inspired MNIST Generator using Qwen and Flow Matching"
readme = "project_brief_v1.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
